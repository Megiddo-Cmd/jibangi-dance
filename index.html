<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17131c">
<title>지방이 3D Motion Capture</title>
<link rel="stylesheet" href="./fatty-motion-style.css">
</head>
<body>
<main class="app-shell">
<header class="topbar">
  <div class="brand"><div class="logo">🥟</div><div><small>FATTY MOTION LAB</small><h1>지방이 3D 모션 캡처</h1></div></div>
  <div class="live-pill" id="livePill"><i></i><span id="liveLabel">대기 중</span></div>
</header>
<section class="grid">
  <section class="stage-card">
    <div class="toolbar"><div><small>REAL-TIME 3D RIG</small><h2>움직이면 지방이도 움직여요 ✨</h2></div><div class="stats"><b id="fpsValue">--</b> FPS · <b id="confidenceValue">--</b></div></div>
    <div class="stage" id="stage">
      <video id="camera" autoplay playsinline muted></video>
      <canvas id="threeCanvas"></canvas>
      <div class="stage-message" id="stageMessage"><span>✨</span><span id="stageMessageText"></span></div>
    </div>
    <div class="actions">
      <button class="primary" id="startButton">▶ 지방이 깨우기</button>
      <button class="secondary" id="stopButton" disabled>잠깐 쉬기</button>
      <button class="secondary" id="mirrorButton" aria-pressed="true">↔ 거울 모드</button>
    </div>
  </section>
  <aside class="control-card">
    <small>CONTROL ROOM</small><h2>모션 캡처 설정</h2>
    <label>카메라<select id="cameraSelect"><option value="">자동으로 선택</option></select></label>
    <button class="refresh" id="refreshCameraButton">↻ 카메라 목록 새로고침</button>
    <small id="cameraHint">iPhone 카메라를 선택할 수 있어요.</small>
    <label class="range-label"><span>부드러움</span><output id="smoothingValue">60%</output></label>
    <input id="smoothingRange" type="range" min="0" max="90" value="60">
    <div class="info">🦴 <b>15개 본 리그</b><br>MediaPipe 관절 → 지방이 Armature → 실시간 변형</div>
    <div class="joints"><span>머리</span><span>어깨</span><span>팔꿈치</span><span>손목</span><span>골반</span><span>무릎</span><span>발목</span></div>
    <p class="privacy">🔒 영상은 브라우저에서만 처리해요.</p>
  </aside>
</section>
<footer>MediaPipe Pose Landmarker · Three.js · FattyMotionRig</footer>
</main>
<script type="module" src="./fatty-motion-app.js"></script>
</body>
</html>
