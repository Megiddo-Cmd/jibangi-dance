<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>지방이 3D Motion Capture</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div><h1>지방이 3D 모션 캡처</h1><p>카메라의 움직임을 3D 지방이에 적용해요</p></div>
      <div class="status" id="status">대기 중</div>
    </header>
    <section class="stage"><canvas id="threeCanvas"></canvas><div class="loading" id="loading">지방이 불러오는 중…</div></section>
    <section class="controls">
      <button id="startBtn">▶ 시작</button><button id="stopBtn" disabled>■ 정지</button>
      <label><input type="checkbox" id="mirrorToggle" checked> 좌우 반전</label>
      <label>카메라 <select id="cameraSelect"></select></label>
      <label>보정 <input id="smoothingRange" type="range" min="0" max="0.95" step="0.05" value="0.65"><span id="smoothingValue">0.65</span></label>
    </section>
    <section class="stats"><span>FPS <b id="fps">0</b></span><span>신뢰도 <b id="confidence">0%</b></span></section>
    <video id="video" autoplay playsinline muted hidden></video>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
